<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PC Phone</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <div class="chrome">
      <button id="settings-toggle" type="button" title="تنظیمات" aria-expanded="true">⚙</button>
      <div class="brand">PC Phone</div>
      <p id="status">آماده</p>
      <button id="popout" type="button" title="پنجره جدا">⧉</button>
    </div>
    <aside id="settings" class="open">
      <div class="mode-row">
        <button id="connect-usb" type="button">اتصال USB</button>
        <button id="connect-wifi" type="button">اتصال Wi-Fi</button>
      </div>
      <p id="scan-progress"></p>
      <label class="host-field">
        <span>IP وای‌فای گوشی (اگر پیدا نشد)</span>
        <input id="host" type="text" placeholder="همان عددی که روی گوشی نوشته شده" autocomplete="off" />
      </label>
    </aside>
    <main>
      <div class="phone">
        <span class="side-btn vol" aria-hidden="true"></span>
        <span class="side-btn pwr" aria-hidden="true"></span>
        <div class="phone-body">
          <div class="island" aria-hidden="true"></div>
          <div id="stage" class="phone-screen">
            <canvas id="screen" tabindex="0"></canvas>
            <p id="hint">USB یا Wi-Fi را جدا بزنید. برای وای‌فای هر دو باید به همان روتر وصل باشند.</p>
          </div>
          <div class="home-bar" aria-hidden="true"></div>
        </div>
      </div>
    </main>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
